name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build + smoke
    runs-on: ubuntu-latest
    # A backgrounded server that survives a step can hold the runner
    # pipe open and wedge the job indefinitely. Fail in minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Installed straight from ziglang.org: mlugg/setup-zig 404s on every
      # mirror it tries, for 0.16.0 and for master alike, and the 0.16 Io API
      # this code targets is only in 0.16.0.
      - name: Install Zig 0.16.0
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o /tmp/zig.tar.xz
          mkdir -p /tmp/zig && tar -xJf /tmp/zig.tar.xz -C /tmp/zig --strip-components=1
          echo "/tmp/zig" >> $GITHUB_PATH
      # Built from source, not installed from the latest release: this
      # boilerplate binds its listener with listen_on(host, port), which landed
      # after the newest tagged machin. Switch back to install.sh once a
      # release carries it.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build machin from source
        run: |
          git clone --depth 1 https://github.com/javimosch/machin /tmp/machin
          (cd /tmp/machin && go build -o machin .)
          mkdir -p "$HOME/.local/bin"
          cp /tmp/machin/machin "$HOME/.local/bin/machin"
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build
        run: ./build.sh

      - name: Smoke test
        run: ./machin-poll version


      # The boilerplates are comparison instruments: they must all implement the
      # same contract, or comparing their binary sizes is meaningless. This
      # proves it instead of asserting it.
      - name: Build the conformance harness
        run: |
          git clone --depth 1 https://github.com/javimosch/cli-spec-conformance /tmp/csc
          (cd /tmp/csc && ./build.sh)

      - name: Spec conformance
        run: /tmp/csc/cli-spec-conformance check ./machin-poll --specs output,guide,daemon

      - name: Report binary size
        run: |
          set -e
          BIN=$(echo "./machin-poll -version || ./machin-poll --help" | awk '{print $1}')
          echo "binary=$BIN size=$(stat -c%s "$BIN") bytes"
